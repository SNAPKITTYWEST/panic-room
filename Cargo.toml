[package]
name = "panic-room"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }